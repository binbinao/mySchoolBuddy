<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>mySchoolBuddy · 中学生学习助手</title>
<style>
  :root{
    --ink:#1C1C1E; --ink-2:#3A3A3C; --mute:#8E8E93; --line:#E8E8ED;
    --bg:#FAFAFC; --card:#FFFFFF; --gold:#F59E0B; --silver:#A1A1AA;
    --ok:#10B981; --warn:#F59E0B; --bad:#EF4444; --blue:#3B82F6;
    --r:14px; --sh:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
    background:var(--bg); color:var(--ink); padding-bottom:80px;
  }
  header{
    position:sticky;top:0;z-index:20;background:rgba(250,250,252,.86);
    backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line);
  }
  .hd{max-width:960px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:12px}
  .logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--ink),#555);
    color:var(--gold);display:grid;place-items:center;font-weight:700;font-size:14px}
  .hd h1{font-size:16px;font-weight:650;letter-spacing:-.2px}
  .hd .sp{flex:1}
  .dday{font-size:12px;color:var(--mute);background:var(--card);border:1px solid var(--line);
    padding:4px 10px;border-radius:999px}
  .dday b{color:var(--bad);font-variant-numeric:tabular-nums}

  nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:rgba(255,255,255,.9);
    backdrop-filter:saturate(180%) blur(12px);border-top:1px solid var(--line)}
  .nav{max-width:960px;margin:0 auto;display:flex;padding:8px 12px;gap:6px}
  .nav button{flex:1;border:0;background:transparent;color:var(--mute);font-size:12px;
    padding:8px 4px;border-radius:10px;cursor:pointer;font-family:inherit;transition:.15s}
  .nav button .ic{display:block;font-size:18px;margin-bottom:2px}
  .nav button.on{background:var(--ink);color:#fff}

  main{max-width:960px;margin:0 auto;padding:20px}
  section{display:none} section.on{display:block}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    padding:18px;box-shadow:var(--sh);margin-bottom:16px}
  .card h2{font-size:14px;font-weight:650;color:var(--ink-2);margin-bottom:14px;
    display:flex;align-items:center;gap:8px}
  .card h2 .tag{font-size:11px;font-weight:500;color:var(--mute);background:#F4F4F6;
    padding:2px 8px;border-radius:6px}

  .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .stat{background:#FCFCFD;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .stat .n{font-size:24px;font-weight:680;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
  .stat .l{font-size:12px;color:var(--mute);margin-top:2px}
  .stat .n.ok{color:var(--ok)} .stat .n.warn{color:var(--warn)} .stat .n.bad{color:var(--bad)}

  label{display:block;font-size:12px;color:var(--mute);margin:12px 0 5px}
  input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);
    border-radius:9px;font:inherit;font-size:14px;background:#fff;color:var(--ink);outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--silver);box-shadow:0 0 0 3px rgba(161,161,170,.12)}
  textarea{resize:vertical;min-height:60px}
  .row{display:grid;gap:10px;grid-template-columns:1fr 1fr}
  button.primary{width:100%;margin-top:14px;padding:11px;border:0;border-radius:10px;
    background:var(--ink);color:#fff;font:inherit;font-weight:600;font-size:14px;cursor:pointer}
  button.primary:active{opacity:.85}
  button.ghost{padding:6px 11px;border:1px solid var(--line);background:#fff;border-radius:8px;
    font:inherit;font-size:12px;color:var(--mute);cursor:pointer}
  button.ghost:hover{color:var(--ink);border-color:var(--silver)}

  .list{display:flex;flex-direction:column;gap:8px}
  .item{display:flex;gap:12px;align-items:flex-start;padding:11px 13px;
    border:1px solid var(--line);border-radius:10px;background:#FCFCFD}
  .item .body{flex:1;min-width:0}
  .item .t{font-size:14px;font-weight:550;margin-bottom:3px;word-break:break-word}
  .item .m{font-size:12px;color:var(--mute);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .chip{font-size:11px;padding:1px 7px;border-radius:5px;background:#F0F0F3;color:var(--ink-2)}
  .chip.c1{background:#FEF3C7;color:#92400E} /* 概念不清 */
  .chip.c2{background:#DBEAFE;color:#1E40AF} /* 方法没想到 */
  .chip.c3{background:#FCE7F3;color:#9D174D} /* 审题错误 */
  .chip.c4{background:#DCFCE7;color:#166534} /* 表达不规范 */
  .empty{text-align:center;color:var(--mute);font-size:13px;padding:28px 0}

  .bar{height:7px;border-radius:4px;background:#EEEFF2;overflow:hidden;margin-top:6px}
  .bar i{display:block;height:100%;border-radius:4px;background:var(--ok)}
  .rowline{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:2px}
  .rowline .s{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
  .gap{margin-top:14px}
  .heat{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
  .heat span{font-size:12px;padding:5px 10px;border-radius:8px}
  .toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%) translateY(10px);
    background:var(--ink);color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;
    opacity:0;pointer-events:none;transition:.22s;z-index:50}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<header>
  <div class="hd">
    <div class="logo">学</div>
    <h1>mySchoolBuddy</h1>
    <div class="sp"></div>
    <div class="dday">距期末 <b id="dday">--</b> 天</div>
  </div>
</header>

<main>
  <!-- 今日 -->
  <section id="v-home" class="on">
    <div class="card">
      <h2>今日概览 <span class="tag" id="today"></span></h2>
      <div class="grid">
        <div class="stat"><div class="n" id="s-plan">0</div><div class="l">今日任务</div></div>
        <div class="stat"><div class="n ok" id="s-done">0</div><div class="l">已完成</div></div>
        <div class="stat"><div class="n warn" id="s-min">0</div><div class="l">学习分钟</div></div>
        <div class="stat"><div class="n bad" id="s-wrong">0</div><div class="l">本周新增错题</div></div>
      </div>
    </div>
    <div class="card">
      <h2>今日任务</h2>
      <div class="row">
        <div><label>科目</label><select id="p-sub"><option>语文</option><option>数学</option><option>英语</option><option>物理</option><option>化学</option><option>生物</option><option>历史</option><option>地理</option><option>政治</option></select></div>
        <div><label>内容</label><input id="p-task" placeholder="例：二次函数 专题卷 1-3 题" /></div>
      </div>
      <div class="row" style="margin-top:0">
        <div><label>预计分钟</label><input id="p-min" type="number" value="40" min="5" step="5" /></div>
        <div><label>日期</label><input id="p-date" type="date" /></div>
      </div>
      <button class="primary" id="p-add">加入计划</button>
    </div>
    <div class="card">
      <h2>任务清单 <button class="ghost" style="margin-left:auto" id="p-clear">清除已完成</button></h2>
      <div class="list" id="plan-list"></div>
    </div>
  </section>

  <!-- 错题本 -->
  <section id="v-wrong">
    <div class="card">
      <h2>记一道错题</h2>
      <label>题目 / 题干摘要</label>
      <textarea id="w-title" placeholder="例：二次函数 f(x)=x²-4x+3 的最小值"></textarea>
      <div class="row">
        <div><label>学科</label><select id="w-sub"><option>数学</option><option>语文</option><option>英语</option><option>物理</option><option>化学</option><option>生物</option><option>历史</option><option>地理</option><option>政治</option></select></div>
        <div><label>知识点</label><input id="w-point" placeholder="例：二次函数最值" /></div>
      </div>
      <label>错因归类</label>
      <select id="w-cause">
        <option>概念不清</option><option>方法没想到</option><option>计算失误</option><option>审题错误</option><option>表达不规范</option>
      </select>
      <label>正确思路 / 复盘</label>
      <textarea id="w-note" placeholder="下次遇到同类题，先看什么？"></textarea>
      <button class="primary" id="w-add">保存错题</button>
    </div>
    <div class="card">
      <h2>错题清单 <span class="tag" id="w-count">0 条</span></h2>
      <div class="row" style="grid-template-columns:1fr 1fr">
        <div><label>按学科筛选</label><select id="f-sub"><option value="">全部</option></select></div>
        <div><label>按错因筛选</label><select id="f-cause"><option value="">全部</option><option>概念不清</option><option>方法没想到</option><option>计算失误</option><option>审题错误</option><option>表达不规范</option></select></div>
      </div>
      <div class="list gap" id="w-list"></div>
    </div>
  </section>

  <!-- 薄弱项 -->
  <section id="v-weak">
    <div class="card">
      <h2>错因分布 <span class="tag">找规律，不背答案</span></h2>
      <div id="cause-bars"></div>
    </div>
    <div class="card">
      <h2>薄弱知识点</h2>
      <div id="weak-list" class="list"></div>
    </div>
    <div class="card">
      <h2>数据管理</h2>
      <div class="row">
        <div><label>考试日期（倒计时）</label><input id="s-exam" type="date" /></div>
        <div><label>&nbsp;</label><button class="ghost" id="s-export" style="width:100%;height:37px">导出 JSON</button></div>
      </div>
      <div class="row">
        <div><label>&nbsp;</label><button class="ghost" id="s-import" style="width:100%;height:37px">导入 JSON</button></div>
        <div><label>&nbsp;</label><button class="ghost" id="s-reset" style="width:100%;height:37px;color:var(--bad)">清空全部数据</button></div>
      </div>
      <input id="s-file" type="file" accept="application/json" hidden />
    </div>
  </section>
</main>

<nav>
  <div class="nav">
    <button data-v="home" class="on"><span class="ic">◎</span>今日</button>
    <button data-v="wrong"><span class="ic">✎</span>错题本</button>
    <button data-v="weak"><span class="ic">▤</span>薄弱分析</button>
  </div>
</nav>

<div class="toast" id="toast"></div>

<script>
const K='msb.v1';
const db=()=>JSON.parse(localStorage.getItem(K)||'{}');
const save=d=>localStorage.setItem(K,JSON.stringify(d));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const $=(s)=>document.querySelector(s);
const esc=(s)=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const init={plan:[],wrong:[],settings:{exam:''}};
let D=Object.assign({},init,db());

/* nav */
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('section').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); $('#v-'+b.dataset.v).classList.add('on');
});

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),1800);}

/* countdown */
function tick(){
  const t=new Date();
  $('#today').textContent=t.toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'});
  if(!D.settings.exam){$('#dday').textContent='未设置';return;}
  const n=Math.ceil((new Date(D.settings.exam+'T00:00:00')-t)/864e5);
  $('#dday').textContent=n>=0?n:'已过';
}
$('#s-exam').value=D.settings.exam||'';
$('#s-exam').onchange=e=>{D.settings.exam=e.target.value;save(D);tick();toast('已更新考试日期');};

/* plan */
const todayStr=()=>new Date().toISOString().slice(0,10);
$('#p-date').value=todayStr();
$('#p-add').onclick=()=>{
  const task=$('#p-task').value.trim();
  if(!task){toast('先写点任务内容');return;}
  D.plan.push({id:uid(),task,sub:$('#p-sub').value,min:+$('#p-min').value||30,
    date:$('#p-date').value||todayStr(),done:false});
  save(D);$('#p-task').value='';render();toast('已加入计划');
};
$('#p-clear').onclick=()=>{const n=D.plan.length;D.plan=D.plan.filter(p=>!p.done);
  save(D);render();toast(n-D.plan.length?`清除 ${n-D.plan.length} 项`:'还没有已完成项');};

function renderPlan(){
  const day=todayStr();
  const list=D.plan.filter(p=>p.date===day);
  const done=list.filter(p=>p.done).length;
  $('#s-plan').textContent=list.length;$('#s-done').textContent=done;
  $('#s-min').textContent=list.filter(p=>p.done).reduce((a,b)=>a+b.min,0);
  const el=$('#plan-list');
  if(!list.length){el.innerHTML='<div class="empty">今天还没有安排，加一条试试</div>';return;}
  el.innerHTML=list.map(p=>`
    <div class="item">
      <input type="checkbox" ${p.done?'checked':''} data-p="${p.id}" style="width:18px;height:18px;margin-top:2px;accent-color:#1C1C1E" />
      <div class="body">
        <div class="t" style="${p.done?'text-decoration:line-through;color:var(--mute)':''}">${esc(p.task)}</div>
        <div class="m"><span class="chip">${esc(p.sub)}</span><span>${p.min} 分钟</span></div>
      </div>
      <button class="ghost" data-del="${p.id}">删</button>
    </div>`).join('');
  el.querySelectorAll('[data-p]').forEach(c=>c.onchange=()=>{
    D.plan.find(x=>x.id===c.dataset.p).done=c.checked;save(D);render();});
  el.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    D.plan=D.plan.filter(x=>x.id!==b.dataset.del);save(D);render();});
}

/* wrong */
$('#w-add').onclick=()=>{
  const t=$('#w-title').value.trim();
  if(!t){toast('题干不能为空');return;}
  D.wrong.unshift({id:uid(),title:t,sub:$('#w-sub').value,point:$('#w-point').value.trim()||'未标注',
    cause:$('#w-cause').value,note:$('#w-note').value.trim(),ts:Date.now()});
  save(D);$('#w-title').value='';$('#w-point').value='';$('#w-note').value='';
  render();toast('错题已保存');
};
const ci={'概念不清':1,'方法没想到':2,'计算失误':3,'审题错误':4,'表达不规范':5};
function fillFilters(){
  const subs=[...new Set(D.wrong.map(w=>w.sub))];
  const fs=$('#f-sub'),cur=fs.value;
  fs.innerHTML='<option value="">全部</option>'+subs.map(s=>`<option>${esc(s)}</option>`).join('');
  fs.value=cur;
}
function renderWrong(){
  fillFilters();
  const fs=$('#f-sub').value,fc=$('#f-cause').value;
  const list=D.wrong.filter(w=>(!fs||w.sub===fs)&&(!fc||w.cause===fc));
  $('#w-count').textContent=D.wrong.length+' 条';
  const wk=new Date();wk.setDate(wk.getDate()-7);
  $('#s-wrong').textContent=D.wrong.filter(w=>w.ts>=wk).length;
  const el=$('#w-list');
  if(!list.length){el.innerHTML='<div class="empty">没有符合条件的错题</div>';return;}
  el.innerHTML=list.map(w=>`
    <div class="item">
      <div class="body">
        <div class="t">${esc(w.title)}</div>
        <div class="m">
          <span class="chip">${esc(w.sub)}</span>
          <span class="chip">${esc(w.point)}</span>
          <span class="chip c${ci[w.cause]||0}">${esc(w.cause)}</span>
          <span>${new Date(w.ts).toLocaleDateString('zh-CN')}</span>
        </div>
        ${w.note?`<div class="m" style="margin-top:6px;color:var(--ink-2)">💡 ${esc(w.note)}</div>`:''}
      </div>
      <button class="ghost" data-wdel="${w.id}">删</button>
    </div>`).join('');
  el.querySelectorAll('[data-wdel]').forEach(b=>b.onclick=()=>{
    D.wrong=D.wrong.filter(x=>x.id!==b.dataset.wdel);save(D);render();});
}
$('#f-sub').onchange=renderWrong;$('#f-cause').onchange=renderWrong;

/* analysis */
function renderWeak(){
  const total=D.wrong.length;
  const byCause={};
  D.wrong.forEach(w=>byCause[w.cause]=(byCause[w.cause]||0)+1);
  const keys=Object.keys(byCause).sort((a,b)=>byCause[b]-byCause[a]);
  $('#cause-bars').innerHTML=keys.length?keys.map(k=>{
    const p=Math.round(byCause[k]/total*100);
    const col=p>=40?'var(--bad)':p>=25?'var(--warn)':'var(--ok)';
    return `<div style="margin-bottom:13px">
      <div class="rowline"><span>${esc(k)}</span><span class="s">${byCause[k]} 题 · ${p}%</span></div>
      <div class="bar"><i style="width:${p}%;background:${col}"></i></div></div>`;
  }).join(''):'<div class="empty">还没有数据</div>';

  const byPoint={};
  D.wrong.forEach(w=>byPoint[w.point]=(byPoint[w.point]||0)+1);
  const pts=Object.entries(byPoint).sort((a,b)=>b[1]-a[1]);
  const mx=pts.length?pts[0][1]:1;
  const el=$('#weak-list');
  if(!pts.length){el.innerHTML='<div class="empty">记录 3 道以上错题，这里会告诉你优先补哪块</div>';return;}
  el.innerHTML=pts.map(([k,v])=>`
    <div class="item">
      <div class="body">
        <div class="rowline"><span class="t" style="margin:0">${esc(k)}</span><span class="s">${v} 题</span></div>
        <div class="bar"><i style="width:${Math.round(v/mx*100)}%;background:${v>=3?'var(--bad)':v>=2?'var(--warn)':'var(--silver)'}"></i></div>
      </div>
    </div>`).join('');
  const heat=document.createElement('div');
  heat.className='heat';
  heat.innerHTML=`<span style="color:var(--mute);font-size:12px;width:100%;margin-bottom:2px">热区：</span>`+
    pts.filter(p=>p[1]>=2).map(([k,v])=>`<span style="background:#FEE2E2;color:#991B1B">${esc(k)} ×${v}</span>`).join('');
  el.appendChild(heat);
}

function render(){tick();renderPlan();renderWrong();renderWeak();}
$('#s-export').onclick=()=>{
  const b=new Blob([JSON.stringify(D,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download='myschoolbuddy-'+todayStr()+'.json';a.click();toast('已导出');
};
$('#s-import').onclick=()=>$('#s-file').click();
$('#s-file').onchange=e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{D=Object.assign({},init,JSON.parse(r.result));save(D);render();toast('导入成功');}
  catch(_){toast('文件格式不对');}};r.readAsText(f);
};
$('#s-reset').onclick=()=>{if(confirm('确定清空所有任务、错题和设置？不可恢复。')){
  D=JSON.parse(JSON.stringify(init));save(D);$('#s-exam').value='';render();toast('已清空');}};

render();
</script>
</body>
</html>
